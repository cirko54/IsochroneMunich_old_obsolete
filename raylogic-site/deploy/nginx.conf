# RayLogic – nginx im Container; TLS terminiert Cloudflare, Zugriff über Cloudflare Tunnel.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Echte Client-IP vom Cloudflare Tunnel (cloudflared) übernehmen
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;

    # www → Apex (Zertifikat muss beide Namen abdecken)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # Datenschutz: keine Zugriffsprotokolle, nur Fehler (siehe datenschutz.html)
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Saubere URLs: /impressum → impressum.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        # Keine Dateinamen-Hashes → moderates Caching mit Revalidierung
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;
}
