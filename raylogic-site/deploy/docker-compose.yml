# Synology Container Manager → Projekt → "Erstellen" → Pfad: dieser Ordner
services:
  raylogic-web:
    image: nginx:1.27-alpine
    container_name: raylogic-web
    restart: unless-stopped
    ports:
      - "8081:8080"          # DSM-Reverse-Proxy zeigt auf localhost:8081
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
